name: Submit survey responses

on:
  workflow_dispatch:
    inputs:
      start_index:
        description: "Row to start from (0 = first row)"
        required: true
        default: "0"
      total_responses:
        description: "How many rows to submit (leave blank = as many as fit in ~5 hours)"
        required: false
        default: ""
      csv_file:
        description: "CSV file to read"
        required: true
        default: "antibiotic_survey_cleaned.csv"

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run survey script
        env:
          START_INDEX: ${{ inputs.start_index }}
          TOTAL_RESPONSES: ${{ inputs.total_responses }}
          CSV_FILE: ${{ inputs.csv_file }}
          MAX_RUNTIME_MINUTES: "300"
        run: python -u direct_runner.py 2>&1 | tee run_log.txt

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-results-${{ github.run_number }}
          path: |
            run_log.txt
            run_summary.txt
            failed_rows.csv
            failed_row_*.png
          if-no-files-found: ignore
